<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionario OpenVAS</title>
<style>
  :root{--bg:#f8fafc;--card:#fff;--fg:#0f172a;--muted:#64748b;--line:#cbd5e1;--acc:#0f766e;--ok:#16a34a;--ko:#b91c1c;--okbg:#dcfce7;--kobg:#fee2e2}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111a2e;--fg:#e2e8f0;--muted:#94a3b8;--line:#334155;--acc:#2dd4bf;--okbg:#14532d;--kobg:#450a0a}}
  :root[data-theme="dark"]{--bg:#0b1220;--card:#111a2e;--fg:#e2e8f0;--muted:#94a3b8;--line:#334155;--acc:#2dd4bf;--okbg:#14532d;--kobg:#450a0a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
  .top{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:8px}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
  .bar div{height:100%;background:var(--acc);transition:width .3s}
  h2{font-size:1.05rem;margin:0 0 12px}
  .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
  .opt:disabled{cursor:default}
  .opt.ok{background:var(--okbg);border-color:var(--ok)}
  .opt.ko{background:var(--kobg);border-color:var(--ko)}
  .exp{margin-top:10px;padding:10px;border-left:4px solid var(--acc);font-size:.9rem}
  .next{margin-top:14px;padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
  .big{font-size:3rem;font-weight:800;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Cuestionario de autoevaluación</h1>
  <p class="sub">12 preguntas sobre el contenido del manual. Las preguntas se barajan en cada intento.</p>
  <div class="card" id="q"></div>
</main>
<script>
const Q=[
 ["¿Qué componente gestiona tareas, resultados y usuarios?",["gvmd","gsad","openvas-scanner","Redis"],0,"gvmd es el gestor central; guarda todo en PostgreSQL."],
 ["¿En qué puerto escucha GSA por defecto en Kali?",["443","8080","9392","9390"],2,"https://127.0.0.1:9392"],
 ["Un Windows con cortafuegos devuelve un informe vacío. ¿Causa más probable?",["Feeds desactualizados","El alive test ICMP lo dio por muerto","Falta la Port List","safe_checks activado"],1,"Windows bloquea ICMP por defecto; usa ARP Ping o Consider Alive."],
 ["¿Qué QoD tiene típicamente una detección basada en banner?",["30 %","80 %","97 %","100 %"],1,"remote_banner = 80 %."],
 ["¿Qué QoD tienen las comprobaciones de paquetes con credenciales?",["70 %","80 %","97 %","99 %"],2,"package / registry = 97 %."],
 ["¿Qué umbral de QoD aplica GSA por defecto?",["0 %","50 %","70 %","95 %"],2,"min_qod=70 oculta las detecciones menos fiables."],
 ["CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H es…",["7.5 High","8.8 High","9.8 Critical","10.0 Critical"],2,"Es el vector típico de ejecución remota sin autenticación: 9.8."],
 ["¿Qué objeto define QUÉ se escanea?",["Task","Scan Config","Target","Scanner"],2,"El Target: hosts, puertos, credenciales y alive test."],
 ["¿Qué hace un Override?",["Añade un comentario","Cambia la severidad de un resultado","Borra el resultado","Relanza el NVT"],1,"Una Note solo comenta; un Override cambia la severidad (p. ej. a False Positive)."],
 ["El backporting provoca sobre todo…",["Falsos negativos","Falsos positivos en detecciones por banner","Escaneos más lentos","Errores de feed"],1,"La distribución parchea sin cambiar la versión; el banner engaña al escáner."],
 ["Tras bloquear un puerto con cortafuegos, el hallazgo sale como Gone. Eso significa…",["Vulnerabilidad corregida","Vulnerabilidad mitigada desde la posición del escáner","Falso positivo","Error del delta"],1,"El software sigue siendo vulnerable; solo deja de ser accesible desde ahí."],
 ["Antes de escanear la red de un cliente necesitas…",["Feeds al día y nada más","Autorización escrita con alcance definido","Avisar por teléfono","Usar safe_checks"],1,"Sin autorización escrita no se escanea (CP art. 197 bis)."]
];
const box=document.getElementById("q");let order,i,ok;
function start(){order=Q.map((_,k)=>k).sort(()=>Math.random()-.5);i=0;ok=0;show()}
function show(){
  if(i===order.length){const p=Math.round(ok/Q.length*100);
    box.innerHTML=`<div class="big">${ok}/${Q.length}</div><p style="text-align:center">${p>=80?"¡Excelente! Dominas los conceptos básicos.":p>=50?"Bien, repasa los capítulos de las preguntas falladas.":"Repasa el manual, en especial los capítulos 6–9."}</p><div style="text-align:center"><button class="next" id="again">Repetir</button></div>`;
    document.getElementById("again").onclick=start;return}
  const [t,o,c,e]=Q[order[i]];
  box.innerHTML=`<div class="top"><span>Pregunta ${i+1} de ${Q.length}</span><span>Aciertos: ${ok}</span></div><div class="bar"><div style="width:${i/Q.length*100}%"></div></div><h2>${t}</h2>`+
    o.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join("")+`<div id="fb"></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===c)x.classList.add("ok")});
    if(k===c)ok++;else b.classList.add("ko");
    document.getElementById("fb").innerHTML=`<div class="exp">${k===c?"✔ Correcto.":"✘ Incorrecto."} ${e}</div><button class="next" id="nx">Siguiente →</button>`;
    document.getElementById("nx").onclick=()=>{i++;show()};
  });
}
start();
</script>
</body>
</html>
